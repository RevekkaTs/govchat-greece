services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
    - chroma_db:/app/data/chroma_db
    - sqlite_data:/app/sqlite_data
    environment:
      - DATABASE_URL=sqlite:///./sqlite_data/govchat.db

  frontend:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000

volumes:
  chroma_db:
    driver: local
  sqlite_data:
    driver: local